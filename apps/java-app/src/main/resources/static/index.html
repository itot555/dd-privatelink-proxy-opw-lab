<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>dd-lab</title>
  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem("dd-lab-theme");
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        document.documentElement.dataset.theme =
          savedTheme === "light" || savedTheme === "dark" ? savedTheme : systemTheme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Sans", "Noto Sans JP", sans-serif;
      --background: #f4f6fb;
      --surface: #ffffff;
      --surface-soft: #f8f9fd;
      --foreground: #192033;
      --muted: #68738a;
      --border: #dfe4ee;
      --accent: #6246d8;
      --accent-hover: #5238c3;
      --accent-soft: #eeeaff;
      --accent-foreground: #ffffff;
      --result-background: #f2f4f9;
      --result-foreground: #30394e;
      --shadow: 0 18px 50px rgba(42, 50, 74, 0.09);
      --focus: #866df0;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: #0d111b;
      --surface: #171c29;
      --surface-soft: #1d2332;
      --foreground: #f4f6fc;
      --muted: #9aa6bc;
      --border: #30394e;
      --accent: #8b72f4;
      --accent-hover: #9d88f7;
      --accent-soft: #292344;
      --accent-foreground: #ffffff;
      --result-background: #0a0e16;
      --result-foreground: #d9dfeb;
      --shadow: 0 20px 56px rgba(0, 0, 0, 0.24);
      --focus: #b6a5ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      margin: 0;
      background:
        radial-gradient(circle at 12% 0, color-mix(in srgb, var(--accent) 10%, transparent), transparent 28%),
        var(--background);
      color: var(--foreground);
      line-height: 1.6;
      transition: background-color 160ms ease, color 160ms ease;
    }

    button {
      font: inherit;
    }

    .page {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 56px;
    }

    .brand {
      color: var(--accent);
      font-family: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .theme-picker {
      display: inline-flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-soft);
    }

    .theme-option {
      min-width: 72px;
      padding: 7px 12px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }

    .theme-option[aria-pressed="true"] {
      background: var(--surface);
      color: var(--foreground);
      box-shadow: 0 1px 5px color-mix(in srgb, var(--foreground) 12%, transparent);
    }

    .theme-option:focus-visible,
    .action:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 45%, transparent);
      outline-offset: 2px;
    }

    .hero {
      max-width: 680px;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-family: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 52px);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .description {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .panel {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 17px;
    }

    .panel-header p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .flow-label {
      color: var(--muted);
      font-family: "SFMono-Regular", "Cascadia Code", Consolas, monospace;
      font-size: 11px;
      white-space: nowrap;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .action {
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: var(--accent);
      color: var(--accent-foreground);
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: background-color 140ms ease, transform 140ms ease;
    }

    .action:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .action.secondary {
      border-color: var(--border);
      background: var(--surface-soft);
      color: var(--foreground);
    }

    .action.secondary:hover {
      background: var(--accent-soft);
    }

    .result-section {
      margin-top: 18px;
    }

    .result-label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    pre {
      min-height: 68px;
      max-height: 260px;
      margin: 0;
      padding: 14px 16px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--result-background);
      color: var(--result-foreground);
      font: 12px/1.55 "SFMono-Regular", "Cascadia Code", Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (max-width: 720px) {
      .topbar {
        align-items: flex-start;
        margin-bottom: 40px;
      }

      .actions {
        grid-template-columns: repeat(2, 1fr);
      }

      .panel-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 440px) {
      .page {
        width: min(100% - 22px, 920px);
        padding-top: 22px;
      }

      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .theme-picker {
        align-self: flex-start;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      .action {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div class="brand">dd-lab</div>
      <div class="theme-picker" role="group" aria-label="表示テーマ">
        <button class="theme-option" type="button" data-theme-option="light" aria-pressed="false">
          通常
        </button>
        <button class="theme-option" type="button" data-theme-option="dark" aria-pressed="false">
          ダーク
        </button>
      </div>
    </div>

    <header class="hero">
      <p class="eyebrow">APM · DBM · E2E Trace</p>
      <h1>Observability<br>Test Console</h1>
      <p class="description">
        Java → Python → RDS PostgreSQL の処理を実行し、正常・遅延・エラーの
        APMトレースとDBMクエリを発生させます。
      </p>
    </header>

    <section class="panel" aria-labelledby="operations-title">
      <div class="panel-header">
        <div>
          <h2 id="operations-title">テスト操作</h2>
          <p>確認したい処理パターンを選択してください。</p>
        </div>
        <span class="flow-label">Java → Python → PostgreSQL</span>
      </div>

      <div class="actions">
        <button class="action" type="button" data-method="GET" data-path="/hello">
          正常クエリ
        </button>
        <button class="action secondary" type="button" data-method="POST"
                data-path="/items?name=browser-test">
          INSERT
        </button>
        <button class="action secondary" type="button" data-method="GET" data-path="/timeout">
          遅延クエリ
        </button>
        <button class="action secondary" type="button" data-method="GET" data-path="/error">
          DBエラー
        </button>
      </div>

      <div class="result-section">
        <span class="result-label">Response</span>
        <pre id="result" aria-live="polite">操作を選択してください。</pre>
      </div>
    </section>
  </main>

  <script>
    const themeOptions = document.querySelectorAll("[data-theme-option]");
    const result = document.querySelector("#result");

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      themeOptions.forEach((option) => {
        option.setAttribute("aria-pressed", String(option.dataset.themeOption === theme));
      });

      try {
        localStorage.setItem("dd-lab-theme", theme);
      } catch {
        // Storageが利用できない場合も、現在のページではthemeを適用する。
      }
    }

    applyTheme(document.documentElement.dataset.theme);

    themeOptions.forEach((option) => {
      option.addEventListener("click", () => applyTheme(option.dataset.themeOption));
    });

    document.querySelectorAll("[data-path]").forEach((button) => {
      button.addEventListener("click", async () => {
        result.textContent = `${button.dataset.method} ${button.dataset.path} ...`;

        try {
          const response = await fetch(button.dataset.path, {
            method: button.dataset.method,
          });
          const body = await response.text();
          result.textContent = `HTTP ${response.status}\n${body}`;
        } catch (error) {
          result.textContent = String(error);
        }
      });
    });
  </script>
</body>
</html>
